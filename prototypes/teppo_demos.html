<title>Teppo Demos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: tabs to pick a demo, one handheld screen, up to three big buttons */
:root {
  --bg: #120f1c; --shell: #2a2540; --edge: #3b3458; --rim: #0b0a10;
  --fg: #ece8f6; --muted: #a49cc0; --accent: #ffd45a; --btn: #1c1830; --hit: #e0483c;
  --display: "Press Start 2P", ui-monospace, monospace;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 36px; }
main { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--display); font-size: clamp(15px, 3.8vw, 22px); color: var(--accent); margin: 0; letter-spacing: .04em; }
.lede { margin: 0; color: var(--muted); line-height: 1.5; max-width: 60ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: 600 13px var(--body); background: var(--btn); color: var(--fg); border: 2px solid var(--edge); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--btn); border-color: var(--accent); }
.shell { background: var(--shell); border: 2px solid var(--edge); border-radius: 18px 18px 48px 18px; padding: 14px; display: grid; gap: 14px; }
.screen { background: var(--rim); border-radius: 10px; padding: 10px; }
canvas { display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 3px; touch-action: none; }
.how { margin: 0; font-size: 14px; line-height: 1.5; color: var(--fg); min-height: 3em; }
.pads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; user-select: none; -webkit-user-select: none; }
.pads button { font-family: var(--display); font-size: 12px; height: 64px; background: var(--hit); color: #fff; border: 3px solid #ff8a7a; border-radius: 14px; box-shadow: 0 5px 0 #7a1a14; cursor: pointer; touch-action: none; }
.pads button.on { transform: translateY(4px); box-shadow: 0 1px 0 #7a1a14; }
.pads button small { display: block; font: 11px var(--body); opacity: .8; margin-top: 4px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>

<main>
  <h1>TEPPO DEMOS</h1>
  <p class="lede">Five takes on the pole-striking drill. Pick one, tap the screen to start, and tell me which feel best.</p>
  <div class="tabs" id="tabs" role="group" aria-label="Demo"></div>
  <section class="shell" aria-label="Demo screen">
    <div class="screen"><canvas id="cv" width="240" height="160" aria-label="Teppo demo"></canvas></div>
    <p class="how" id="how"></p>
    <div class="pads" id="pads">
      <button id="p0"></button><button id="p1"></button><button id="p2"></button>
    </div>
  </section>
</main>

      draw(s) { if (s.breakT < 40) { g.globalAlpha = s.breakT / 40; } drawPole(sh(), s.cracks); g.globalAlpha = 1; drawWrestler();
        const half = Math.max(.07, .13 - s.broken * .015), x = 60, w = 120; g.fillStyle = "#0a0a14"; g.fillRect(x, 140, w, 10); g.fillStyle = "#2f7a3a"; g.fillRect(x + w * (.5 - half), 140, w * half * 2, 10); g.fillStyle = "#9dffb8"; g.fillRect(x + w * (.5 - half * .35), 140, w * half * .7, 10); g.fillStyle = "#fff"; g.fillRect(Math.round(x + w * s.pos) - 1, 137, 3, 16);
        txt("POLES " + s.broken, 6, 6, "#fff", "left"); txt("CRACKS", 6, 18, "#ffd45a", "left"); bar(6, 28, 50, 5, s.cracks / s.need, "#ffaa28"); } },

    { name: "4 Charge + Thrust", buttons: ["", "HOLD", ""], how: "Hold to wind up, release inside the gold band for a heavy thrust. The band shrinks every time you land one. Hold too long and you whiff.",
      init(s) { s.power = 0; s.held = false; s.hp = 14; s.max = 14; s.streak = 0; s.broken = 0; s.time = 30 * 60; },
      band(s) { const w = Math.max(.07, .24 - s.streak * .03); return [.93 - w, .93]; },
      update(s) { if (s.held) { s.power += 1 / 70; if (s.power >= 1.12) { s.held = false; s.power = 0; s.streak = 0; W.stun = 30; sfx.bad(); pop("WHIFF!", "#ff8a7a"); } } },
      press(s, i) { if (i === 1 && W.stun <= 0) { s.held = true; s.power = 0; } },
      release(s, i) { if (i !== 1 || !s.held) return; s.held = false; const p = s.power, [lo, hi] = this.band(s); s.power = 0; strike(86);
        if (p >= lo && p <= hi) { s.hp -= 4; s.streak++; sfx.perfect(); shake(); pop("HEAVY THRUST!", "#9dffb8"); }
        else if (p > hi) { s.streak = 0; W.stun = 20; sfx.bad(); pop("OVERSHOT", "#ff8a7a"); }
        else { s.streak = 0; if (p > .3) { s.hp -= 1; sfx.hit(p); pop("LIGHT", "#ffd45a"); } else { sfx.miss(); pop("TOO SOFT", "#ff8a7a"); } }
        if (s.hp <= 0) { s.broken++; s.max += 4; s.hp = s.max; s.time += 8 * 60; sfx.win(); pop("POLE BROKEN! +8s", "#9dffb8", 120, 30); } },
      draw(s) { drawPole(sh(), Math.round((1 - s.hp / s.max) * 12)); drawWrestler(); const [lo, hi] = this.band(s), x = 14, y = 40, h = 80;
        g.fillStyle = "#0a0a14"; g.fillRect(x, y, 12, h); g.fillStyle = "#b8860b"; g.fillRect(x, y + h * (1 - hi), 12, h * (hi - lo)); g.fillStyle = "#ffd45a"; g.fillRect(x, y + h * (1 - hi), 12, 2);
        const p = Math.min(1, s.power); g.fillStyle = s.power > hi ? "#e6463c" : "#6fbf4a"; g.fillRect(x + 3, y + h * (1 - p), 6, h * p); g.strokeStyle = "#e8e2fa"; g.strokeRect(x - .5, y - .5, 13, h + 1);
        txt("POLES " + s.broken, 6, 6, "#fff", "left"); txt("POLE", 150, 6, "#ffd45a", "left"); bar(184, 7, 50, 5, s.hp / s.max, "#e0402a"); txt("STREAK " + s.streak, 6, 18, "#78dcff", "left"); } },

    { name: "5 Oni Pole", buttons: ["LEFT", "", "RIGHT"], how: "Alternate LEFT and RIGHT to drive the oni back. When its eyes flash white it is about to shove: stop striking until it passes, or you get thrown back.",
      init(s) { s.pos = .5; s.last = -1; s.lvl = 1; s.phase = 0; s.pt = 150; s.time = 40 * 60; s.wins = 0; },
      update(s) { s.pos -= .0012 + s.lvl * .0004; if (--s.pt <= 0) { s.phase = (s.phase + 1) % 3; s.pt = s.phase === 0 ? 110 + Math.random() * 90 : s.phase === 1 ? Math.max(22, 44 - s.lvl * 4) : 34; if (s.phase === 1) tone(880, .1, .08); if (s.phase === 2) { s.hitInShove = false; tone(140, .3, .2, "sawtooth", 70); } if (s.phase === 0 && s.hitInShove === false) { s.pos += .05; pop("ONI TIRES", "#9dffb8"); } }
        if (s.pos >= 1) { s.wins++; s.lvl++; s.pos = .5; s.time += 10 * 60; sfx.win(); pop("ONI DRIVEN BACK! +10s", "#9dffb8", 120, 30); }
        if (s.pos <= 0) { s.pos = .4; W.stun = 50; sfx.bad(); pop("THROWN BACK!", "#ff8a7a"); s.time -= 5 * 60; } },
      press(s, i) { if (i === 1 || W.stun > 0) return; const side = i === 0 ? 0 : 1; strike(side ? 90 : 82); W.arm = side;
        if (s.phase === 2) { s.hitInShove = true; s.pos -= .13; W.stun = 26; sfx.bad(); pop("SHOVED!", "#ff8a7a"); return; }
        if (side !== s.last) { s.pos += .034; sfx.hit(.6); shake(); } else { s.pos += .008; sfx.hit(.1); } s.last = side; },
      draw(s) { drawPole(sh() + (s.phase === 2 ? -3 : 0), 0, { glow: s.phase === 1 && (s.pt >> 2) % 2 === 0, angry: s.phase === 2 }); drawWrestler();
        g.fillStyle = "#0a0a14"; g.fillRect(40, 142, 160, 8); g.fillStyle = "#e0402a"; g.fillRect(40 + 160 * s.pos, 142, 160 * (1 - s.pos), 8); g.fillStyle = "#6fbf4a"; g.fillRect(40, 142, 160 * Math.max(0, s.pos), 8); g.fillStyle = "#fff"; g.fillRect(40 + Math.round(160 * s.pos) - 1, 139, 3, 14);
        txt("YOU", 36, 142, "#9dffb8", "right"); txt("ONI", 204, 142, "#ff8a7a", "left"); txt("LEVEL " + s.lvl, 6, 6, "#fff", "left"); if (s.phase === 1) txt("!", POLE_X + 6, 32, "#fff"); } },
  ];
  const sh = () => shakeT < 5 ? (shakeT % 2 ? 2 : -1) : 0;

  // ---- runner
  let cur = 0, S = {}, mode = "title", tick = 0;
  const pads = [0, 1, 2].map(i => document.getElementById("p" + i)), how = document.getElementById("how"), tabs = document.getElementById("tabs");
  GAMES.forEach((gm, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = gm.name; b.addEventListener("click", () => select(i)); tabs.append(b); });
  function select(i) { cur = i; mode = "title"; tick = 0; pops.length = 0; W.stun = 0; W.hitT = 99; const gm = GAMES[i]; how.textContent = gm.how;
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    pads.forEach((p, j) => { p.style.visibility = gm.buttons[j] ? "visible" : "hidden"; p.textContent = gm.buttons[j]; }); gm.init(S = {}); }
  function start() { GAMES[cur].init(S = {}); mode = "play"; pops.length = 0; W.stun = 0; }
  function press(i) { pads[i].classList.add("on"); if (mode !== "play") { if (tick > 20) { start(); tick = 0; } return; } if (GAMES[cur].buttons[i]) GAMES[cur].press(S, i); }
  function release(i) { pads[i].classList.remove("on"); if (mode === "play" && GAMES[cur].release) GAMES[cur].release(S, i); }
  pads.forEach((p, i) => { p.addEventListener("pointerdown", e => { e.preventDefault(); p.setPointerCapture?.(e.pointerId); press(i); }); ["pointerup", "pointercancel", "lostpointercapture"].forEach(t => p.addEventListener(t, () => release(i))); });
  cv.addEventListener("pointerdown", e => { e.preventDefault(); if (mode !== "play") press(1); else if (GAMES[cur].buttons.filter(Boolean).length === 1) press(1); });
  cv.addEventListener("pointerup", () => release(1));
  const KEY = { ArrowLeft: 0, a: 0, "1": 0, ArrowUp: 0, " ": 1, z: 1, s: 1, "2": 1, ArrowDown: 2, ArrowRight: 2, d: 2, "3": 2 };
  addEventListener("keydown", e => { if (e.repeat || e.target.tagName === "BUTTON") return; let i = KEY[e.key]; if (i == null) return; e.preventDefault(); const n = GAMES[cur].buttons.filter(Boolean).length; if (n === 1) i = 1; else if (n === 2 && i === 1) return; if (cur === 0 && e.key === "ArrowDown") i = 2; if (cur === 0 && (e.key === " " || e.key === "s")) i = 1; press(i); });
  addEventListener("keyup", e => { const i = KEY[e.key]; if (i == null) return; const n = GAMES[cur].buttons.filter(Boolean).length; release(n === 1 ? 1 : i); });

  function update() { tick++; W.hitT++; shakeT++; if (W.stun > 0) W.stun--; pops.forEach(p => p.t++); while (pops.length && pops[0].t > 45) pops.shift();
    if (mode !== "play") return; GAMES[cur].update(S); if (--S.time <= 0) { mode = "over"; tick = 0; sfx.win(); } }
  function draw() { g.drawImage(bg, 0, 0); const gm = GAMES[cur]; gm.draw(S);
    if (mode === "play") { txt(Math.ceil(S.time / 60) + "s", 234, 18, S.time < 300 ? "#ff8a7a" : "#fff", "right"); pops.forEach(p => txt(p.s, p.x, p.y - p.t * .3, p.c)); }
    else { g.fillStyle = "rgba(14,10,28,.7)"; g.fillRect(0, 0, 240, 160); txt(gm.name.slice(2).toUpperCase(), 120, 44, "#ffd45a");
      if (mode === "over") { const r = cur === 2 || cur === 3 ? "POLES BROKEN " + S.broken : cur === 4 ? "ONI BEATEN " + S.wins : "SCORE " + S.score; txt("TIME!", 120, 66, "#ff8a7a"); txt(r, 120, 82, "#fff"); }
      if ((tick >> 5) % 2 === 0) txt(mode === "over" ? "TAP TO RETRY" : "TAP TO START", 120, 110, "#78dcff"); } }
  let last = performance.now(), acc = 0;
  function loop(now) { acc += Math.min(200, now - last); last = now; while (acc >= 1000 / 60) { acc -= 1000 / 60; update(); } draw(); requestAnimationFrame(loop); }
  select(0);
  const ready = document.fonts ? document.fonts.load(FONT).catch(() => {}) : Promise.resolve();
  Promise.all([new Promise(r => sheet.complete ? r() : sheet.onload = r), ready]).then(() => requestAnimationFrame(t => { last = t; loop(t); }));
})();
</script>
