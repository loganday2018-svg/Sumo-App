<style>
/* Layout: header, then a grid of looping cards, one per topple option */
:root {
  --bg: #120f1c; --card: #2a2540; --edge: #3b3458;
  --fg: #ece8f6; --muted: #a49cc0; --accent: #ffd45a; --pick: #78dcff;
  --display: "Press Start 2P", ui-monospace, monospace;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 36px; }
main { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-family: var(--display); font-size: clamp(15px, 3.6vw, 22px); color: var(--accent); margin: 0; letter-spacing: .04em; line-height: 1.5; }
.lede { margin: 0; color: var(--muted); line-height: 1.55; max-width: 64ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar button { font: 600 13px var(--body); background: var(--card); color: var(--fg); border: 2px solid var(--edge); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--accent); color: #1c1830; border-color: var(--accent); }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.opt { background: var(--card); border: 2px solid var(--edge); border-radius: 12px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.opt canvas { width: 100%; aspect-ratio: 176 / 96; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 6px; display: block; }
.opt h2 { margin: 0; font-family: var(--display); font-size: 11px; color: var(--accent); letter-spacing: .05em; }
.opt p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.tag { font-family: var(--display); font-size: 8px; color: var(--pick); letter-spacing: .06em; }
</style>
